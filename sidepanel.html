<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Farbe Sidepanel</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/sidepanel.css" />
    <script src="js/theme.js"></script>
    <script src="js/lib/qrious.min.js"></script>
  </head>
  <body>
    <!-- タブナビゲーション -->
    <div class="panel-nav">
      <div class="panel-tab active" data-target="pane-makepiece">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Piece
      </div>
      <div class="panel-tab" data-target="pane-pagenote">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"
          ></path>
          <polyline points="15 3 15 9 21 9"></polyline>
        </svg>
        Note
      </div>
      <div class="panel-tab" data-target="pane-diverse">
        <svg
          class="icon"
          id="icon-diverse"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
        </svg>
        Diverse
        <span
          id="indicator-diverse"
          style="position: absolute; right: 5px; top: 5px; font-size: 10px"
          >●</span
        >
      </div>
      <div class="panel-tab" data-target="pane-qrcode">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
          <path d="M14 14h3v3h-3z"></path>
          <path d="M18 18h3v3h-3z"></path>
          <path d="M14 20h2"></path>
          <path d="M20 14h1"></path>
        </svg>
        QR
      </div>
      <button
        type="button"
        class="settings-link theme-toggle-btn"
        id="theme-toggle"
        title="ダーク / ライトモード切替"
        aria-label="ダーク / ライトモード切替"
      >
        <span class="icon-moon">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="icon-sun">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
      </button>
      <div class="settings-link" id="open-options" title="設定を開く">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
          ></path>
        </svg>
      </div>
    </div>

    <!-- 1. Make Piece ペイン -->
    <div id="pane-makepiece" class="panel-content active">
      <div class="content-title">
        <svg class="icon icon-title" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
          ></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        Make Piece
      </div>

      <div class="form-group">
        <label class="form-label">TASK NAME</label>
        <div class="input-wrapper">
          <svg class="icon input-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <input
            type="text"
            id="task-name"
            class="input-field"
            placeholder="何を作りますか？"
            autocomplete="off"
          />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">NOTE</label>
        <div class="input-wrapper">
          <svg
            class="icon input-icon"
            style="top: 18px; transform: none"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <line x1="21" y1="6" x2="3" y2="6"></line>
            <line x1="15" y1="12" x2="3" y2="12"></line>
            <line x1="17" y1="18" x2="3" y2="18"></line>
          </svg>
          <textarea
            id="task-content"
            class="input-field"
            placeholder="詳細メモ..."
          ></textarea>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">URL</label>
        <div class="input-wrapper">
          <svg class="icon input-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
            ></path>
            <path
              d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
            ></path>
          </svg>
          <input
            type="text"
            id="task-url"
            class="input-field"
            placeholder="https://..."
          />
          <button
            type="button"
            id="get-current-url"
            class="btn-icon"
            title="現在のページを取得"
          >
            <span class="icon-default">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 4-1 2-2 1 2 1 1 2 1-2 2-1-2-1Z"></path>
                <path d="m20 13-.5 1-1 .5 1 .5.5 1 .5-1 1-.5-1-.5Z"></path>
                <path d="M3 21 15 9"></path>
                <path d="m12 6 6 6"></path>
              </svg>
            </span>
            <span class="icon-success">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
          </button>
        </div>
      </div>
      <div style="display: flex; gap: 10px">
        <div class="form-group" style="flex: 1">
          <label class="form-label">STATE</label>
          <div class="input-wrapper">
            <svg class="icon input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <select
              id="task-state"
              class="input-field"
              style="appearance: none; cursor: pointer"
            >
              <option value="INBOX" selected>INBOX</option>
              <option value="Waiting">Waiting</option>
              <option value="Going">Going</option>
            </select>
            <svg
              class="icon input-icon"
              style="left: auto; right: 12px; width: 12px; height: 12px"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
        <div class="form-group" style="flex: 1">
          <label class="form-label">SOURCE</label>
          <div class="input-wrapper">
            <svg class="icon input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
            <select
              id="task-source"
              class="input-field"
              style="appearance: none; cursor: pointer"
            >
              <option value="LOCAL" selected>LOCAL</option>
              <option value="NOTION">NOTION</option>
            </select>
            <svg
              class="icon input-icon"
              style="left: auto; right: 12px; width: 12px; height: 12px"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">DUE DATE</label>
        <div style="display: flex; gap: 8px; align-items: center">
          <div class="input-wrapper" style="width: auto; flex: 1">
            <svg class="icon input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <input type="date" id="task-date" class="input-field" />
          </div>
          <div class="date-chips">
            <div class="date-chip active" data-offset="0">今日</div>
            <div class="date-chip" data-offset="1">明日</div>
            <div class="date-chip" data-offset="7">来週</div>
          </div>
        </div>
      </div>
      <button id="makepiece" class="btn-submit">Gleisに送る</button>
      <div
        id="status-msg"
        style="
          text-align: center;
          font-size: 0.85rem;
          min-height: 20px;
          color: #10b981;
          opacity: 0;
          transition: opacity 0.3s;
          margin-top: 8px;
        "
      >
        送信しました！
      </div>
    </div>

    <!-- 2. Page Note ペイン -->
    <div id="pane-pagenote" class="panel-content">
      <div class="content-title">
        <svg class="icon icon-title" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"
          ></path>
          <polyline points="15 3 15 9 21 9"></polyline>
        </svg>
        Page Note
      </div>
      <div id="current-url">Loading...</div>
      <textarea
        id="note-area"
        placeholder="このページに関するメモを入力..."
      ></textarea>
      <div style="display: flex; justify-content: flex-end">
        <button
          id="note-clear-btn"
          class="btn-icon"
          style="
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
            gap: 6px;
            color: var(--danger);
          "
          title="このメモをクリア"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
          </svg>
          クリア
        </button>
      </div>
      <div id="save-status" class="status">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="save-status-text">Saved</span>
      </div>
    </div>

    <!-- 3. Diverse Observer ペイン -->
    <div id="pane-diverse" class="panel-content">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <div class="content-title" style="margin-bottom: 0">
          <svg class="icon icon-title" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
          </svg>
          Diverse Observer
        </div>
        <button id="refresh-status" class="btn-icon" title="再スキャン・状態更新">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path
              d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
            ></path>
          </svg>
        </button>
      </div>
      <div
        style="
          background: var(--card-bg);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 16px;
          font-size: 0.9rem;
        "
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
          "
        >
          <span style="color: var(--text-muted)">監視状態:</span
          ><span id="obs-status" style="font-weight: 600; color: var(--danger)"
            >停止中</span
          >
        </div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
          "
        >
          <span style="color: var(--text-muted)">監視対象:</span
          ><span id="obs-count" style="font-weight: 600">0個</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="color: var(--text-muted)">通知設定:</span
          ><span id="obs-notify" class="status-badge">設定を確認中...</span>
        </div>
      </div>
      <button id="open-lms-btn" class="btn-icon">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        LMSを開く
      </button>
    </div>

    <!-- 4. QR Code ペイン -->
    <div id="pane-qrcode" class="panel-content">
      <div class="content-title">
        <svg class="icon icon-title" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
          <path d="M14 14h3v3h-3z"></path>
          <path d="M18 18h3v3h-3z"></path>
        </svg>
        QR Code
      </div>
      <div class="form-group">
        <label class="form-label">URL / TEXT</label>
        <div class="input-wrapper">
          <svg class="icon input-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
            ></path>
            <path
              d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
            ></path>
          </svg>
          <input
            type="text"
            id="qr-url"
            class="input-field"
            placeholder="https://..."
            autocomplete="off"
          />
          <button
            type="button"
            id="qr-get-url"
            class="btn-icon"
            title="現在のページを取得"
          >
            <span class="icon-default">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 4-1 2-2 1 2 1 1 2 1-2 2-1-2-1Z"></path>
                <path d="m20 13-.5 1-1 .5 1 .5.5 1 .5-1 1-.5-1-.5Z"></path>
                <path d="M3 21 15 9"></path>
                <path d="m12 6 6 6"></path>
              </svg>
            </span>
            <span class="icon-success">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
          </button>
        </div>
      </div>
      <div class="qr-preview-box">
        <canvas id="qr-canvas" style="display: none"></canvas>
        <div
          id="qr-placeholder"
          style="color: var(--text-muted); font-size: 0.85rem"
        >
          URLを入力すると<br />QRコードが生成されます
        </div>
      </div>
      <div style="display: flex; gap: 10px">
        <button
          id="qr-copy"
          class="btn-icon"
          style="flex: 1; width: auto; font-size: 0.9rem; gap: 8px"
          disabled
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path
              d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
            ></path>
          </svg>
          画像コピー
        </button>
        <button
          id="qr-download"
          class="btn-icon"
          style="flex: 1; width: auto; font-size: 0.9rem; gap: 8px"
          disabled
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          保存 (PNG)
        </button>
      </div>
      <div
        id="qr-msg"
        style="
          text-align: center;
          font-size: 0.85rem;
          height: 20px;
          color: #10b981;
          opacity: 0;
          transition: opacity 0.3s;
          margin-top: 12px;
        "
      ></div>
    </div>

    <script type="module" src="js/sidepanel/main.js"></script>
  </body>
</html>
