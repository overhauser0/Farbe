<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Farbe Sidepanel</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/sidepanel.css" />
    <!-- ★ 外部CSSを読み込み -->
    <script src="js/lib/qrious.min.js"></script>
  </head>
  <body>
    <!-- タブナビゲーション -->
    <div class="panel-nav">
      <div class="panel-tab active" data-target="pane-makepiece">
        <i class="fas fa-paper-plane"></i> Piece
      </div>
      <div class="panel-tab" data-target="pane-pagenote">
        <i class="fas fa-sticky-note"></i> Note
      </div>
      <div class="panel-tab" data-target="pane-diverse">
        <i class="fas fa-eye" id="icon-diverse"></i> Diverse
      </div>
      <div class="panel-tab" data-target="pane-qrcode">
        <i class="fas fa-qrcode"></i> QR
      </div>
      <div class="settings-link" id="open-options" title="設定を開く">
        <i class="fas fa-cog"></i>
      </div>
    </div>

    <!-- 1. Make Piece ペイン -->
    <div id="pane-makepiece" class="panel-content active">
      <div class="content-title"><i class="fas fa-cube"></i> Make Piece</div>

      <div class="form-group">
        <label class="form-label">TASK NAME</label>
        <div class="input-wrapper">
          <i class="fas fa-check-circle input-icon"></i
          ><input
            type="text"
            id="task-name"
            class="input-field"
            placeholder="何を作りますか？"
            autocomplete="off"
          />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">NOTE</label>
        <div class="input-wrapper">
          <i
            class="fas fa-align-left input-icon"
            style="top: 18px; transform: none"
          ></i
          ><textarea
            id="task-content"
            class="input-field"
            placeholder="詳細メモ..."
          ></textarea>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">URL</label>
        <div class="input-wrapper">
          <i class="fas fa-link input-icon"></i
          ><input
            type="text"
            id="task-url"
            class="input-field"
            placeholder="https://..."
          /><button
            type="button"
            id="get-current-url"
            class="btn-icon"
            title="現在のページを取得"
          >
            <i class="fas fa-wand-magic-sparkles"></i>
          </button>
        </div>
      </div>
      <div style="display: flex; gap: 10px">
        <div class="form-group" style="flex: 1">
          <label class="form-label">STATE</label>
          <div class="input-wrapper">
            <i class="fas fa-tasks input-icon"></i
            ><select
              id="task-state"
              class="input-field"
              style="appearance: none; cursor: pointer"
            >
              <option value="INBOX" selected>INBOX</option>
              <option value="Waiting">Waiting</option>
              <option value="Going">Going</option></select
            ><i
              class="fas fa-chevron-down input-icon"
              style="left: auto; right: 12px; font-size: 10px"
            ></i>
          </div>
        </div>
        <div class="form-group" style="flex: 1">
          <label class="form-label">SOURCE</label>
          <div class="input-wrapper">
            <i class="fas fa-database input-icon"></i
            ><select
              id="task-source"
              class="input-field"
              style="appearance: none; cursor: pointer"
            >
              <option value="LOCAL" selected>LOCAL</option>
              <option value="NOTION">NOTION</option></select
            ><i
              class="fas fa-chevron-down input-icon"
              style="left: auto; right: 12px; font-size: 10px"
            ></i>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">DUE DATE</label>
        <div style="display: flex; gap: 8px; align-items: center">
          <div class="input-wrapper" style="width: auto; flex: 1">
            <i class="fas fa-calendar input-icon"></i
            ><input type="date" id="due-date" class="input-field" />
          </div>
          <div class="date-chips">
            <div class="date-chip active" data-offset="0">今日</div>
            <div class="date-chip" data-offset="1">明日</div>
            <div class="date-chip" data-offset="7">来週</div>
          </div>
        </div>
      </div>
      <button id="makepiece" class="btn-submit">Gleisに送る</button>
      <div
        id="status-msg"
        style="
          text-align: center;
          font-size: 0.85rem;
          height: 20px;
          color: #10b981;
          opacity: 0;
          transition: opacity 0.3s;
          margin-top: 8px;
        "
      >
        送信しました！
      </div>
    </div>

    <!-- 2. Page Note ペイン -->
    <div id="pane-pagenote" class="panel-content">
      <div class="content-title">
        <i class="fas fa-sticky-note"></i> Page Note
      </div>
      <div id="current-url">Loading...</div>
      <textarea
        id="note-area"
        placeholder="このページに関するメモを入力..."
      ></textarea>
      <div style="display: flex; justify-content: flex-end">
        <button
          id="note-clear-btn"
          class="btn-icon"
          style="
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
            gap: 6px;
            color: var(--danger);
          "
          title="このメモをクリア"
        >
          <i class="fas fa-trash-alt"></i> クリア
        </button>
      </div>
      <div id="save-status" class="status">
        <i class="fas fa-check"></i> Saved
      </div>
    </div>

    <!-- 3. Diverse Observer ペイン -->
    <div id="pane-diverse" class="panel-content">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <div class="content-title" style="margin-bottom: 0">
          <i class="fas fa-eye"></i> Diverse Observer
        </div>
        <button id="refresh-status" class="btn-icon">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
      <div
        style="
          background: var(--card-bg);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 16px;
          font-size: 0.9rem;
        "
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
          "
        >
          <span style="color: #6b7280">監視状態:</span
          ><span id="obs-status" style="font-weight: 600; color: #ef4444"
            >停止中</span
          >
        </div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
          "
        >
          <span style="color: #6b7280">監視対象:</span
          ><span id="obs-count" style="font-weight: 600">0個</span>
        </div>
        <div style="display: flex; justify-content: space-between">
          <span style="color: #6b7280">通知設定:</span
          ><span
            id="obs-notify"
            style="
              background: #f3f4f6;
              padding: 4px 8px;
              border-radius: 4px;
              font-size: 0.75rem;
            "
            >設定を確認中...</span
          >
        </div>
      </div>
      <button id="open-lms-btn" class="btn-icon">
        <i class="fas fa-external-link-alt"></i>
        LMSを開く
      </button>
      <p
        style="
          font-size: 0.8rem;
          color: #9ca3af;
          margin-top: 15px;
          line-height: 1.5;
        "
      >
        ※監視状態に応じて、上部のタブアイコンの色がリアルタイムに変化します。
      </p>
    </div>

    <!-- 4. QR Code ペイン -->
    <div id="pane-qrcode" class="panel-content">
      <div class="content-title"><i class="fas fa-qrcode"></i> QR Code</div>
      <div class="form-group">
        <label class="form-label">URL / TEXT</label>
        <div class="input-wrapper">
          <i class="fas fa-link input-icon"></i>
          <input
            type="text"
            id="qr-url"
            class="input-field"
            placeholder="https://..."
            autocomplete="off"
          />
          <button
            type="button"
            id="qr-get-url"
            class="btn-icon"
            title="現在のページを取得"
          >
            <i class="fas fa-wand-magic-sparkles"></i>
          </button>
        </div>
      </div>
      <div
        style="
          text-align: center;
          margin: 15px 0;
          background: #fff;
          padding: 15px;
          border-radius: 8px;
          border: 1px solid var(--border);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 150px;
        "
      >
        <canvas id="qr-canvas" style="display: none"></canvas>
        <div id="qr-placeholder" style="color: #9ca3af; font-size: 0.85rem">
          URLを入力すると<br />QRコードが生成されます
        </div>
      </div>
      <div style="display: flex; gap: 10px">
        <button
          id="qr-copy"
          class="btn-icon"
          style="flex: 1; width: auto; font-size: 0.9rem; gap: 8px"
          disabled
        >
          <i class="fas fa-copy"></i> 画像コピー
        </button>
        <button
          id="qr-download"
          class="btn-icon"
          style="flex: 1; width: auto; font-size: 0.9rem; gap: 8px"
          disabled
        >
          <i class="fas fa-download"></i> 保存 (PNG)
        </button>
      </div>
      <div
        id="qr-msg"
        style="
          text-align: center;
          font-size: 0.85rem;
          height: 20px;
          color: #10b981;
          opacity: 0;
          transition: opacity 0.3s;
          margin-top: 12px;
        "
      ></div>
    </div>

    <script type="module" src="js/sidepanel/main.js"></script>
  </body>
</html>
